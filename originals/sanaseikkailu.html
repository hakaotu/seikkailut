<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sanaseikkailu 🌟</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ── Header ── */
    .header { text-align: center; padding: 18px 10px 8px; color: white; }
    .header h1 {
      font-size: 2.6em;
      text-shadow: 3px 3px 0 rgba(0,0,0,.2);
      animation: bounce 2.5s infinite;
    }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    .stars-display { font-size: 1.9em; margin-top: 5px; letter-spacing: 3px; }

    /* ── Card ── */
    .game-container {
      background: white;
      border-radius: 30px;
      padding: 24px 22px 28px;
      margin: 14px;
      max-width: 700px;
      width: 93%;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
      text-align: center;
    }

    /* ── Difficulty buttons ── */
    .level-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }
    .level-btn {
      padding: 10px 18px;
      border: 3px solid transparent;
      border-radius: 22px;
      font-size: .95em;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      transition: all .2s;
      opacity: .65;
    }
    .level-btn.easy   { background: #d4f5d4; color: #2a7a2a; border-color: #2a7a2a; }
    .level-btn.medium { background: #fff0c2; color: #a06000; border-color: #a06000; }
    .level-btn.hard   { background: #ffd4d4; color: #900;    border-color: #900; }
    .level-btn.active { opacity: 1; transform: scale(1.07); box-shadow: 0 3px 10px rgba(0,0,0,.15); }

    /* ── Theme buttons ── */
    .theme-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 14px; flex-wrap: wrap; }
    .theme-btn {
      padding: 9px 18px;
      border: 3px solid transparent;
      border-radius: 22px;
      font-size: .92em;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      transition: all .2s;
      opacity: .6;
    }
    .theme-btn.normal { background: #e8f4ff; color: #1a5a9a; border-color: #1a5a9a; }
    .theme-btn.hp     { background: #f5e6ff; color: #5a1a8a; border-color: #5a1a8a; }
    .theme-btn.active { opacity: 1; transform: scale(1.07); box-shadow: 0 3px 10px rgba(0,0,0,.15); }

    /* ── Tavutus toggle ── */
    .tavutus-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 14px; }
    .tavutus-label { font-size: 1em; color: #555; font-weight: bold; }
    .toggle-switch { position: relative; width: 52px; height: 28px; cursor: pointer; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-track {
      position: absolute; inset: 0;
      background: #ccc; border-radius: 28px;
      transition: background .25s;
    }
    .toggle-track::before {
      content: '';
      position: absolute;
      width: 22px; height: 22px;
      left: 3px; top: 3px;
      background: white; border-radius: 50%;
      box-shadow: 0 1px 4px rgba(0,0,0,.3);
      transition: transform .25s;
    }
    .toggle-switch input:checked + .toggle-track { background: #764ba2; }
    .toggle-switch input:checked + .toggle-track::before { transform: translateX(24px); }

    /* ── Syllable separator in slots ── */
    .syl-sep {
      font-size: 2em; font-weight: bold;
      color: #bbb; line-height: 64px;
      user-select: none; margin: 0 2px;
    }

    /* ── Score / progress ── */
    .score-display { font-size: 1.15em; color: #764ba2; font-weight: bold; margin-bottom: 6px; }
    .progress-bar-container { background: #eee; border-radius: 10px; height: 14px; overflow: hidden; }
    .progress-bar { height: 100%; background: linear-gradient(90deg,#667eea,#764ba2); border-radius: 10px; transition: width .5s ease; }

    /* ── Emoji picture ── */
    .picture-wrap { min-height: 110px; display: flex; align-items: center; justify-content: center; margin: 12px 0 4px; }
    .picture-display {
      font-size: 6.5em;
      cursor: pointer;
      transition: transform .2s;
      animation: appear .45s ease;
      line-height: 1;
    }
    .picture-display:hover { transform: scale(1.1); }
    .picture-hidden { font-size: 5em; color: #ddd; user-select: none; }
    @keyframes appear { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }

    /* ── Speak button ── */
    .speak-btn {
      background: linear-gradient(135deg,#f093fb,#f5576c);
      color: white; border: none; border-radius: 50px;
      padding: 11px 28px; font-size: 1.1em;
      font-family: inherit; cursor: pointer; margin: 5px;
      box-shadow: 0 4px 14px rgba(0,0,0,.2);
      transition: transform .2s;
    }
    .speak-btn:hover  { transform: scale(1.06); }
    .speak-btn:active { transform: scale(.94); }
    .speak-btn.playing { background: linear-gradient(135deg,#a18cd1,#fbc2eb); }

    .hint-text { color: #bbb; font-size: .88em; margin: 3px 0 8px; min-height: 1.2em; }

    /* ── Word slots ── */
    .word-slots {
      display: flex; justify-content: center; gap: 7px;
      margin: 14px 0 8px; min-height: 76px;
      align-items: center; flex-wrap: wrap;
    }
    .word-slot {
      width: 54px; height: 64px;
      border: 3px dashed #ccc; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.9em; font-weight: bold; color: #764ba2;
      transition: all .25s;
    }
    .word-slot.filled { border-color: #764ba2; background: #f0e6ff; animation: pop .18s ease; }
    .word-slot.correct-flash { background: #c8f5c8; border-color: #4CAF50; }
    @keyframes pop { from{transform:scale(.4)} to{transform:scale(1)} }

    /* ── Scrambled letter tiles (easy / medium) ── */
    .letter-buttons { display: flex; justify-content: center; gap: 9px; flex-wrap: wrap; margin: 8px 0; }
    .letter-btn {
      width: 60px; height: 60px;
      border: none; border-radius: 14px;
      font-size: 1.8em; font-weight: bold;
      font-family: inherit; cursor: pointer; color: white;
      box-shadow: 0 4px 0 rgba(0,0,0,.2);
      transition: all .14s;
    }
    .letter-btn:active  { transform: translateY(4px); box-shadow: none; }
    .letter-btn:disabled { opacity: .3; cursor: not-allowed; transform: none; }

    /* Tile colours by index */
    .letter-btn:nth-child(8n+1) { background: #FF6B6B; }
    .letter-btn:nth-child(8n+2) { background: #4ECDC4; }
    .letter-btn:nth-child(8n+3) { background: #45B7D1; }
    .letter-btn:nth-child(8n+4) { background: #96CEB4; color:#333; }
    .letter-btn:nth-child(8n+5) { background: #f0a500; }
    .letter-btn:nth-child(8n+6) { background: #DDA0DD; }
    .letter-btn:nth-child(8n+7) { background: #FF8C69; }
    .letter-btn:nth-child(8n+0) { background: #6EC6CA; }

    /* ── Alphabet keyboard (hard) ── */
    .alphabet-grid {
      display: flex; justify-content: center; gap: 7px;
      flex-wrap: wrap; margin: 10px 0;
      max-width: 560px; margin-left: auto; margin-right: auto;
    }
    .alpha-btn {
      width: 50px; height: 50px;
      border: 2px solid #bbb; border-radius: 10px;
      font-size: 1.5em; font-weight: bold;
      font-family: inherit; cursor: pointer;
      background: #f8f4ff; color: #555;
      box-shadow: 0 3px 0 #bbb;
      transition: all .12s;
    }
    .alpha-btn:hover  { border-color: #764ba2; color: #764ba2; background: #ede5ff; transform: translateY(-1px); }
    .alpha-btn:active { transform: translateY(3px); box-shadow: none; }
    .alpha-btn.used   { opacity: .35; }

    /* ── Clear button ── */
    .clear-btn {
      background: #FF6B6B; color: white;
      border: none; border-radius: 50px;
      padding: 8px 20px; font-size: .92em;
      font-family: inherit; cursor: pointer; margin: 6px;
      transition: all .2s;
    }
    .clear-btn:hover { background: #e44; transform: scale(1.05); }

    /* ── Feedback ── */
    .feedback { font-size: 1.7em; min-height: 52px; display:flex; align-items:center; justify-content:center; font-weight:bold; }
    .feedback.success { color: #4CAF50; }
    .feedback.error   { color: #f44336; }

    @keyframes correctAnim { 0%{transform:scale(1)} 50%{transform:scale(1.18)} 100%{transform:scale(1)} }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)} }

    /* ── Next button ── */
    .next-btn {
      background: linear-gradient(135deg,#43e97b,#38f9d7);
      color: white; border: none; border-radius: 50px;
      padding: 13px 36px; font-size: 1.2em;
      font-family: inherit; cursor: pointer;
      margin: 10px auto; display: block;
      box-shadow: 0 4px 15px rgba(0,0,0,.2);
      transition: transform .2s;
    }
    .next-btn:hover { transform: scale(1.06); }

    /* ── Celebration overlay ── */
    .celebration {
      position: fixed; inset: 0;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,.65); z-index: 100;
    }
    .celebration.show { display: flex; }
    .celebration-content {
      background: white; border-radius: 30px;
      padding: 38px 34px; text-align: center;
      animation: zoomIn .45s ease;
    }
    @keyframes zoomIn { from{transform:scale(0)} to{transform:scale(1)} }
    .celebration-content h2 { font-size: 2.5em; color: #764ba2; margin-bottom: 10px; }

    /* Confetti */
    .confetti-container { position: fixed; inset: 0; pointer-events: none; z-index: 99; }
    .confetti { position: absolute; width: 10px; height: 10px; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(105vh) rotate(720deg); opacity: 0; } }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .header h1    { font-size: 1.9em; }
      .picture-display { font-size: 4.5em; }
      .letter-btn   { width: 50px; height: 50px; font-size: 1.5em; }
      .alpha-btn    { width: 42px; height: 42px; font-size: 1.25em; }
      .word-slot    { width: 46px; height: 56px; font-size: 1.6em; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>🌟 Sanaseikkailu 🌟</h1>
  <div class="stars-display" id="starsDisplay">☆☆☆☆☆</div>
</div>

<div class="game-container">

  <!-- Theme buttons -->
  <div class="theme-row">
    <button class="theme-btn normal active" id="btn-normal" onclick="setTheme('normal')">📚 Normaali</button>
    <button class="theme-btn hp"            id="btn-hp"     onclick="setTheme('hp')">⚡ Harry Potter</button>
  </div>

  <!-- Difficulty buttons -->
  <div class="level-row">
    <button class="level-btn easy   active" id="btn-easy"   onclick="setDifficulty('easy')">🟢 Helppo</button>
    <button class="level-btn medium"        id="btn-medium" onclick="setDifficulty('medium')">🟡 Keskitaso</button>
    <button class="level-btn hard"          id="btn-hard"   onclick="setDifficulty('hard')">🔴 Vaikea</button>
  </div>

  <!-- Tavutus toggle -->
  <div class="tavutus-row">
    <span class="tavutus-label">🔤 Tavutus</span>
    <label class="toggle-switch">
      <input type="checkbox" id="tavutusToggle" onchange="toggleTavutus(this.checked)">
      <span class="toggle-track"></span>
    </label>
  </div>

  <!-- Score + progress -->
  <div class="score-display" id="scoreDisplay">Pisteet: 0</div>
  <div class="progress-bar-container">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>

  <!-- Picture area -->
  <div class="picture-wrap" id="pictureWrap">
    <span class="picture-display" id="pictureDisplay">🐱</span>
  </div>

  <!-- Speak button -->
  <button class="speak-btn" id="speakBtn" onclick="speakWord()">🔊 Kuuntele sana</button>
  <div class="hint-text" id="hintText"></div>

  <!-- Word slots (all modes) -->
  <div class="word-slots" id="wordSlots"></div>

  <!-- Scrambled tiles (easy / medium) -->
  <div class="letter-buttons" id="letterButtons"></div>

  <!-- Full alphabet (hard) -->
  <div class="alphabet-grid" id="alphabetGrid" style="display:none"></div>

  <!-- Clear button -->
  <button class="clear-btn" id="clearBtn" onclick="clearWord()">↩️ Aloita alusta</button>

  <!-- Feedback -->
  <div class="feedback" id="feedback"></div>

  <!-- Next -->
  <button class="next-btn" id="nextBtn" style="display:none" onclick="nextWord()">Seuraava ➡️</button>

</div>

<!-- Victory audio -->
<audio id="victoryAudio" preload="none"></audio>

<!-- Celebration -->
<div class="celebration" id="celebration">
  <div class="confetti-container" id="confettiContainer"></div>
  <div class="celebration-content">
    <h2>🎉 Mahtavaa! 🎉</h2>
    <p style="font-size:1.35em;margin:10px 0" id="celebrationScore"></p>
    <p style="font-size:1.05em;color:#555">Olet tosi hyvä lukija!</p>
    <button class="next-btn" onclick="restartGame()" style="display:block;margin:20px auto 0">🔄 Pelaa uudelleen!</button>
  </div>
</div>

<script>
// ── Word bank ──────────────────────────────────────────────────────────────
const WORDS = [
  { word:'KISSA',   emoji:'🐱', hint:'Sanoo miau!' },
  { word:'KOIRA',   emoji:'🐶', hint:'Haukkuu!' },
  { word:'AUTO',    emoji:'🚗', hint:'Vroom vroom!' },
  { word:'PUU',     emoji:'🌳', hint:'Kasvaa metsässä' },
  { word:'TALO',    emoji:'🏠', hint:'Asutaan siellä' },
  { word:'LINTU',   emoji:'🐦', hint:'Lentää taivaalla' },
  { word:'KALA',    emoji:'🐟', hint:'Ui vedessä' },
  { word:'KUKKA',   emoji:'🌸', hint:'Kaunis kasvi' },
  { word:'PALLO',   emoji:'⚽', hint:'Pallolla pelataan' },
  { word:'MUNA',    emoji:'🥚', hint:'Kana munii' },
  { word:'OMENA',   emoji:'🍎', hint:'Punainen hedelmä' },
  { word:'BANAANI', emoji:'🍌', hint:'Keltainen hedelmä' },
  { word:'JÄÄTELÖ', emoji:'🍦', hint:'Kylmää ja makeaa!' },
  { word:'TÄHTI',   emoji:'⭐', hint:'Loistaa yötaivaalla' },
  { word:'AURINKO', emoji:'☀️', hint:'Paistaa päivällä' },
  { word:'KUU',     emoji:'🌙', hint:'Paistaa yöllä' },
  { word:'KIRJA',   emoji:'📚', hint:'Luetaan!' },
  { word:'HATTU',   emoji:'🎩', hint:'Laitetaan päähän' },
  { word:'SYDÄN',   emoji:'❤️', hint:'Rakkauden merkki' },
  { word:'HIIRI',   emoji:'🐭', hint:'Pieni eläin' },
  { word:'KARHU',   emoji:'🐻', hint:'Iso karvainen eläin' },
  { word:'NORSU',   emoji:'🐘', hint:'Pitkä kärsä' },
  { word:'PISTE',   emoji:'🔴', hint:'Pyöreä merkki' },
  { word:'TULI',    emoji:'🔥', hint:'Kuuma ja punainen' },
];

const HP_WORDS = [
  { word:'JÄSTI',      emoji:'🧑',  hint:'Ei osaa taikuutta' },
  { word:'TAIKASAUVA', emoji:'🪄',  hint:'Loitsujen työkalu' },
  { word:'TYLYPAHKA',  emoji:'🏰',  hint:'Taikurien koulu' },
  { word:'LUUTA',      emoji:'🧹',  hint:'Taikuri lentää sillä' },
  { word:'VIISTOKUJA', emoji:'🏪',  hint:'Taikurien ostoskatu' },
  { word:'LOITSU',     emoji:'✨',  hint:'Taikurin lausuma sana' },
  { word:'PATA',       emoji:'🫕',  hint:'Taikajuomia keitetään' },
  { word:'HAAMU',      emoji:'👻',  hint:'Läpinäkyvä asukas' },
  { word:'TAIKURI',    emoji:'🧙',  hint:'Taikuutta osaava' },
  { word:'NOITA',      emoji:'🧙‍♀️', hint:'Taikuutta osaava nainen' },
  { word:'LOHIKÄÄRME', emoji:'🐉',  hint:'Tulta syytävä otus' },
  { word:'PÖLLÖ',      emoji:'🦉',  hint:'Tuo kirjeet perille' },
  { word:'VIITTA',     emoji:'🧥',  hint:'Tekee näkymättömäksi' },
  { word:'HUISPAUS',   emoji:'🏆',  hint:'Taikurien urheilulaji' },
  { word:'SAMMAKKO',   emoji:'🐸',  hint:'Suklaasammakko!' },
  { word:'PEIKKO',     emoji:'👺',  hint:'Vartioivat pankkia' },
  { word:'KUTKA',      emoji:'🦔',  hint:'Söpö pieni otus' },
  { word:'TAIKA',      emoji:'🌟',  hint:'Taikurin supervoima' },
  { word:'KAMMIO',     emoji:'🚪',  hint:'Salainen huone' },
  { word:'TAIKAJUOMA', emoji:'🧪',  hint:'Ihmeellinen liemi' },
];

const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ'.split('');

const PRAISE_OK  = ['Hienoa! 🌟','Oikein! ⭐','Mahtavaa! 🎉','Tosi hyvä! 🏆','Loistavaa! 🌈','Upea! 💪','Bravo! 🎊'];
const PRAISE_ERR = ['Ei ihan, yritä uudelleen! 💪','Melkein! Kokeile vielä! 🤗','Harjoittelemalla oppii! 📚','Kuuntele sana ja yritä! 🔊'];
const CONFETTI_COLORS = ['#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#FFEAA7','#DDA0DD','#FFB347'];
const MAX_QUESTIONS = 10;

// ── State ──────────────────────────────────────────────────────────────────
let theme       = 'normal';
let difficulty  = 'easy';
let tavutus     = false;
let deck        = [];
let qIndex      = 0;
let score       = 0;
let answered    = 0;
let builtWord   = '';
let usedBtnIdx  = new Set(); // for hard mode: track used letter positions

// ── Finnish syllabifier ────────────────────────────────────────────────────
const VOWELS      = new Set('AEIOUÄÖY');
const DIPHTHONGS  = new Set(['AI','EI','OI','UI','YI','ÄI','ÖI','AU','EU','IU','OU','ÄY','ÖY','IE','UO','YÖ']);
const isV = c => VOWELS.has(c);
const isC = c => c !== undefined && !VOWELS.has(c);

function syllabify(word) {
  const w = word.toUpperCase();
  if (w.length <= 2) return [w];

  const breaks = new Set();

  for (let i = 1; i < w.length; i++) {
    const p2 = w[i - 2], p1 = w[i - 1], c0 = w[i], c1 = w[i + 1];

    if (isV(p1) && isV(c0)) {
      // Two adjacent vowels: split unless long vowel or diphthong
      const pair = p1 + c0;
      if (p1 !== c0 && !DIPHTHONGS.has(pair)) breaks.add(i);
    } else if (isC(p1) && isV(c0) && i >= 2) {
      // Consonant followed by vowel → potential break before consonant
      if (isV(p2)) {
        // V-CV pattern: break before consonant
        breaks.add(i - 1);
      } else if (isC(p2) && i >= 3 && isV(w[i - 3])) {
        // VCC-V pattern: break between consonants
        breaks.add(i - 1);
      }
    }
  }

  const sorted = [...breaks].sort((a, b) => a - b);
  const result = [];
  let start = 0;
  for (const b of sorted) { result.push(w.slice(start, b)); start = b; }
  result.push(w.slice(start));
  return result.filter(s => s.length > 0);
}

function toggleTavutus(on) {
  tavutus = on;
  loadQuestion();
}

// ── Speech ────────────────────────────────────────────────────────────────
let fiVoice = null;
let voicesReady = false;

function initVoices() {
  const load = () => {
    const voices = speechSynthesis.getVoices();
    if (!voices.length) return;
    // Prefer native Finnish voice, then any fi voice
    fiVoice =
      voices.find(v => v.lang === 'fi-FI' && v.localService) ||
      voices.find(v => v.lang === 'fi-FI') ||
      voices.find(v => v.lang.startsWith('fi')) ||
      null;
    voicesReady = true;
  };
  load();
  speechSynthesis.addEventListener('voiceschanged', load);
}

function speak(text, rate = 0.78, onend = null) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (fiVoice) u.voice = fiVoice;
  u.lang  = 'fi-FI';
  u.rate  = rate;
  u.pitch = 1.05;
  u.volume = 1;
  if (onend) u.onend = onend;
  speechSynthesis.speak(u);
}

// Speaks word at normal pace, then repeats slowly (or syllable by syllable)
function speakWord() {
  if (!deck.length) return;
  const word = deck[qIndex].word.toLowerCase();
  const btn  = $('speakBtn');
  btn.classList.add('playing');
  btn.disabled = true;

  if (tavutus) {
    const syls = syllabify(word).map(s => s.toLowerCase());
    // First speak whole word, then syllable by syllable with pauses
    speak(word, 0.78, () => {
      setTimeout(() => speakSyllables(syls, 0, () => {
        btn.classList.remove('playing');
        btn.disabled = false;
      }), 400);
    });
  } else {
    speak(word, 0.78, () => {
      setTimeout(() => {
        speak(word, 0.52, () => {
          btn.classList.remove('playing');
          btn.disabled = false;
        });
      }, 380);
    });
  }
}

function speakSyllables(syls, i, done) {
  if (i >= syls.length) { done(); return; }
  speak(syls[i], 0.62, () => setTimeout(() => speakSyllables(syls, i + 1, done), 220));
}

// Speak a single letter name
function speakLetter(letter) {
  speak(letter.toLowerCase(), 0.9);
}

// ── Helpers ────────────────────────────────────────────────────────────────
const shuffle = arr => [...arr].sort(() => Math.random() - .5);
const $       = id  => document.getElementById(id);

// ── Game init ──────────────────────────────────────────────────────────────
function setTheme(t) {
  theme = t;
  $('btn-normal').classList.toggle('active', t === 'normal');
  $('btn-hp').classList.toggle('active',     t === 'hp');
  initGame();
}

function initGame() {
  const bank = theme === 'hp' ? HP_WORDS : WORDS;
  deck     = shuffle(bank).slice(0, MAX_QUESTIONS);
  qIndex   = 0;
  score    = 0;
  answered = 0;
  updateHUD();
  loadQuestion();
}

function setDifficulty(d) {
  difficulty = d;
  ['easy','medium','hard'].forEach(x =>
    $('btn-' + x).classList.toggle('active', x === d)
  );
  builtWord = '';
  usedBtnIdx = new Set();
  loadQuestion();
}

// ── Load question ──────────────────────────────────────────────────────────
function loadQuestion() {
  const item = deck[qIndex];
  builtWord  = '';
  usedBtnIdx = new Set();

  // Picture: show on easy, hide on medium/hard
  const wrap = $('pictureWrap');
  if (difficulty === 'easy') {
    wrap.innerHTML = `<span class="picture-display" id="pictureDisplay" onclick="speakWord()" title="Kuuntele sana">${item.emoji}</span>`;
    $('hintText').textContent = item.hint;
  } else {
    wrap.innerHTML = `<span class="picture-hidden">❓</span>`;
    $('hintText').textContent = difficulty === 'medium'
      ? 'Kuuntele sana ja rakenna se kirjaimista!'
      : 'Kuuntele sana ja kirjoita se itse!';
  }

  $('feedback').textContent = '';
  $('feedback').className   = 'feedback';
  $('nextBtn').style.display = 'none';

  buildSlots(item.word);

  if (difficulty === 'hard') {
    $('letterButtons').innerHTML  = '';
    $('letterButtons').style.display = 'none';
    buildAlphabet();
  } else {
    $('alphabetGrid').style.display  = 'none';
    $('letterButtons').style.display = 'flex';
    buildScrambledTiles(item);
  }

  updateHUD();
  setTimeout(speakWord, 550);
}

// ── Slots ──────────────────────────────────────────────────────────────────
function buildSlots(word) {
  const container = $('wordSlots');
  container.innerHTML = '';

  if (!tavutus) {
    word.split('').forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'word-slot';
      d.id = `slot-${i}`;
      container.appendChild(d);
    });
    return;
  }

  // With tavutus: insert separators between syllables
  const syls = syllabify(word);
  let letterIdx = 0;
  syls.forEach((syl, si) => {
    syl.split('').forEach(_ => {
      const d = document.createElement('div');
      d.className = 'word-slot';
      d.id = `slot-${letterIdx}`;
      container.appendChild(d);
      letterIdx++;
    });
    if (si < syls.length - 1) {
      const sep = document.createElement('span');
      sep.className = 'syl-sep';
      sep.textContent = '-';
      container.appendChild(sep);
    }
  });
}

// ── Easy / Medium: scrambled tiles ────────────────────────────────────────
function buildScrambledTiles(item) {
  const btns = $('letterButtons');
  btns.innerHTML = '';
  const letters = shuffle(item.word.split(''));
  letters.forEach((letter, i) => {
    const btn = document.createElement('button');
    btn.className   = 'letter-btn';
    btn.textContent = letter;
    btn.id  = `lbtn-${i}`;
    btn.onclick = () => pressScrambledLetter(letter, i, item.word);
    btns.appendChild(btn);
  });
}

function pressScrambledLetter(letter, idx, target) {
  if (builtWord.length >= target.length) return;
  builtWord += letter;
  fillSlot(builtWord.length - 1, letter);
  $(`lbtn-${idx}`).disabled = true;
  speakLetter(letter);
  if (builtWord.length === target.length) checkAnswer(target);
}

// ── Hard: full alphabet ────────────────────────────────────────────────────
function buildAlphabet() {
  const grid = $('alphabetGrid');
  grid.innerHTML = '';
  grid.style.display = 'flex';
  ALPHABET.forEach(letter => {
    const btn = document.createElement('button');
    btn.className   = 'alpha-btn';
    btn.textContent = letter;
    btn.id = `abtn-${letter}`;
    btn.onclick = () => pressAlphaLetter(letter);
    grid.appendChild(btn);
  });
}

function pressAlphaLetter(letter) {
  const target = deck[qIndex].word;
  if (builtWord.length >= target.length) return;
  builtWord += letter;
  fillSlot(builtWord.length - 1, letter);
  speakLetter(letter);
  if (builtWord.length === target.length) checkAnswer(target);
}

// ── Shared: fill a slot ────────────────────────────────────────────────────
function fillSlot(index, letter) {
  const slot = $(`slot-${index}`);
  slot.textContent = letter;
  slot.classList.add('filled');
}

// ── Check answer ───────────────────────────────────────────────────────────
function checkAnswer(target) {
  if (builtWord === target) {
    // Flash slots green
    document.querySelectorAll('.word-slot').forEach(s => s.classList.add('correct-flash'));
    registerResult(true);
  } else {
    showFeedback(false);
    document.querySelectorAll('.word-slot').forEach(s => {
      s.style.animation = 'shake .5s ease';
      setTimeout(() => s.style.animation = '', 600);
    });
    setTimeout(clearWord, 900);
  }
}

function clearWord() {
  builtWord = '';
  document.querySelectorAll('.word-slot').forEach(s => {
    s.textContent = '';
    s.classList.remove('filled', 'correct-flash');
  });
  if (difficulty !== 'hard') {
    document.querySelectorAll('.letter-btn').forEach(b => b.disabled = false);
  }
  $('feedback').textContent = '';
  $('feedback').className   = 'feedback';
  $('nextBtn').style.display = 'none';
}

// ── Victory audio ──────────────────────────────────────────────────────────
let victoryTimer = null;

function playVictoryClip() {
  const audio = $('victoryAudio');
  if (!audio) return;
  clearTimeout(victoryTimer);
  audio.currentTime = 0;
  audio.volume = 0.8;
  audio.play().catch(() => {});
  victoryTimer = setTimeout(() => {
    audio.pause();
    audio.currentTime = 0;
  }, 3000);
}

// ── Result ─────────────────────────────────────────────────────────────────
function registerResult(correct) {
  answered++;
  if (correct) { score++; playVictoryClip(); }
  showFeedback(correct);
  updateHUD();

  // Reveal picture on success if hidden
  if (correct && difficulty !== 'easy') {
    const item = deck[qIndex];
    setTimeout(() => {
      $('pictureWrap').innerHTML =
        `<span class="picture-display" style="font-size:4em">${item.emoji}</span>`;
    }, 300);
  }

  if (qIndex + 1 >= MAX_QUESTIONS) {
    setTimeout(showCelebration, 1500);
  } else {
    $('nextBtn').style.display = 'block';
  }
}

function showFeedback(correct) {
  const fb   = $('feedback');
  const msgs = correct ? PRAISE_OK : PRAISE_ERR;
  fb.textContent = msgs[Math.floor(Math.random() * msgs.length)];
  fb.className   = 'feedback ' + (correct ? 'success' : 'error');
  if (correct) fb.style.animation = 'correctAnim .5s ease';
  else         fb.style.animation = '';
}

function nextWord() {
  qIndex++;
  if (qIndex >= MAX_QUESTIONS) { showCelebration(); return; }
  loadQuestion();
}

// ── HUD ────────────────────────────────────────────────────────────────────
function updateHUD() {
  $('scoreDisplay').textContent = `Pisteet: ${score} / ${answered}`;
  $('progressBar').style.width  = ((qIndex / MAX_QUESTIONS) * 100) + '%';
  const ratio = answered > 0 ? score / answered : 1;
  const full  = Math.round(ratio * 5);
  $('starsDisplay').textContent =
    Array.from({length:5}, (_,i) => i < full ? '⭐' : '☆').join('');
}

// ── Celebration ────────────────────────────────────────────────────────────
function showCelebration() {
  const pct = Math.round((score / MAX_QUESTIONS) * 100);
  $('celebrationScore').textContent =
    pct === 100 ? `Täydellinen tulos! ${score}/${MAX_QUESTIONS} 🏆` :
    pct >= 70   ? `Hienoa! ${score}/${MAX_QUESTIONS} oikein! 🌟` :
                  `${score}/${MAX_QUESTIONS} oikein — harjoittele lisää! 💪`;

  const cont = $('confettiContainer');
  cont.innerHTML = '';
  for (let i = 0; i < 100; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.cssText = `
      left:${Math.random()*100}vw; top:-14px;
      background:${CONFETTI_COLORS[i % CONFETTI_COLORS.length]};
      border-radius:${Math.random()>.5?'50%':'3px'};
      animation-duration:${(Math.random()*2+1.3).toFixed(2)}s;
      animation-delay:${(Math.random()*1.8).toFixed(2)}s;
    `;
    cont.appendChild(c);
  }
  $('celebration').classList.add('show');
  setTimeout(() => speak('Mahtavaa! Olet tosi hyvä lukija!', 0.75), 600);
}

function restartGame() {
  $('celebration').classList.remove('show');
  $('confettiContainer').innerHTML = '';
  initGame();
}

// ── Audio loading ──────────────────────────────────────────────────────────
function loadAudio() {
  const audio = $('victoryAudio');
  if (typeof google !== 'undefined' && google.script) {
    // Running inside GAS – fetch MP3 via server-side DriveApp
    google.script.run
      .withSuccessHandler(base64 => {
        audio.src = 'data:audio/mpeg;base64,' + base64;
      })
      .getAudioBase64();
  } else {
    // Running locally
    audio.src = 'vauhti.mp3';
  }
}

// ── Boot ───────────────────────────────────────────────────────────────────
initVoices();
initGame();
loadAudio();
</script>
